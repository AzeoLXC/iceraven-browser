name: CI & Auto Release

on:
  push:
    branches:
      - iceraven
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-automation:
    name: Build & Release App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK with pieces Gradle skips
        run: ./automation/iceraven/install-sdk.sh

      - name: Inspect memory
        run: free -h

      - name: Create version name
        run: |
          FENIX_VER=$(cat version.txt | tr -d '\n')
          DATE_TAG=$(date +'%Y.%m.%d')
          SHORT_SHA=$(git rev-parse --short HEAD)
          RELEASE_TAG="v${FENIX_VER}-${DATE_TAG}-${SHORT_SHA}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "VERSION_NAME=${RELEASE_TAG}" >> $GITHUB_ENV

      - name: Patch on the fly
        run: |
          ./automation/iceraven/patch_android_components.sh
          ./automation/iceraven/setup_venv.sh

      - name: Replace strings
        run: |
          sed -i 's/Firefox/Iceraven/g' app/src/*/res/values*/*strings.xml
          sed -i '/about_content/s/Mozilla/@forkmaintainers/' app/src/*/res/values*/*strings.xml
          sed -i '/<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%s/%1$s/g; /<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%d/%2$d/g' app/src/*/res/values*/*strings.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build forkRelease variant of app
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: |
          /usr/bin/time -v ./gradlew app:assembleForkRelease -PversionName=${{ env.VERSION_NAME }} --stacktrace --no-daemon

      - name: Create signed APKs
        uses: akliuxingyuan/sign-android-release@v2.0.1
        with:
          releaseDir: gradle/build/app/outputs/apk/forkRelease/
          signingKey: ${{ secrets.DEBUG_SIGNING_KEY }}
          keyAlias: ${{ secrets.DEBUG_ALIAS }}
          keyStorePassword: ${{ secrets.DEBUG_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.DEBUG_KEY_PASSWORD }}

      - name: Prepare APKs for Release
        run: |
          mkdir -p dist_apks
          cp gradle/build/app/outputs/apk/forkRelease/app-arm64-v8a-forkRelease.apk dist_apks/Iceraven-${{ env.RELEASE_TAG }}-arm64-v8a.apk
          cp gradle/build/app/outputs/apk/forkRelease/app-armeabi-v7a-forkRelease.apk dist_apks/Iceraven-${{ env.RELEASE_TAG }}-armeabi-v7a.apk
          cp gradle/build/app/outputs/apk/forkRelease/app-x86_64-forkRelease.apk dist_apks/Iceraven-${{ env.RELEASE_TAG }}-x86_64.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Iceraven Browser ${{ env.RELEASE_TAG }}"
          draft: false
          prerelease: false
          files: dist_apks/*.apk
          body: |
            ### Automated Clean Build
            - **Upstream Fenix Engine:** ${{ env.VERSION_NAME }}
            - **Commit:** ${{ github.sha }}
            - **Release Tag:** ${{ env.RELEASE_TAG }}
            
            #### Download APK:
            - **`arm64-v8a`**: Untuk mayoritas HP Android 64-bit modern
            - **`armeabi-v7a`**: Untuk perangkat Android 32-bit (legacy)
            - **`x86_64`**: Untuk emulator Android PC
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
